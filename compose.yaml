name: hotel
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotel-api:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GIN_MODE: release
      PORT: "8080"
      # DSN Go (go-sql-driver/mysql)
      # change les creds si tu modifies le service mysql
      DB_DSN: "app:app@tcp(mysql:3306)/app?parseTime=true&charset=utf8mb4&loc=UTC"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 5s
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [appnet]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    command:
      # supprime la ligne ci-dessous qui cause l'erreur
      # - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_ALL_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "3306:3306"
    networks: [appnet]

networks:
  appnet:

volumes:
  mysql_data:
